name: Build Master

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@e6e38bacfdf1a337459f332974bb2327a31aaf4b
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Build with Gradle
        run: ./gradlew build
      - name: Cleanup Gradle Cache
        # Remove some files from the Gradle cache, so they aren't cached by GitHub Actions.
        # Restoring these files from a GitHub Actions cache might cause problems for future builds.
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node 24.x
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: app-ui/package-lock.json
      - name: Install dependencies
        run: npm install -D puppeteer karma-chrome-launcher --save-dev @babel/preset-typescript@7.29.7
        working-directory: app-ui
      - name: Build
        run: npm run build
        working-directory: app-ui
      - name: Test
        run: npm run test --no-watch --no-progress --browsers=ChromeHeadlessCI
        working-directory: app-ui

  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node 24.x
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "adopt"
      - name: Install frontend dependencies
        run: npm ci
        working-directory: app-ui
      - name: Start Backend server
        run: ./gradlew bootRun --args='--spring.profiles.active=e2e' &
      - name: Wait for Backend
        run: npx wait-on http://localhost:8080/actuator/health
      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          working-directory: app-ui
          install: false
          build: npm run build
          start: npm run start
          wait-on: http://localhost:4200
      - name: Stop Backend server
        run: curl -X POST http://localhost:8080/actuator/shutdown
        if: always()