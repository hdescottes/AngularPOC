<div align='center'>
  <h1>Hello test CRUD with Angular</h1>
</div>

<div align='center'>
  @if (helloResource.isLoading()) {
    <p>Chargement...</p>
  } @else if (errorMessage(); as message) {
    <p>{{ message }}</p>
    <button type="button" (click)="retry()">Réessayer</button>
  } @else if (helloResource.value()?.title; as title) {
    <p>
      {{ title }}
    </p>
  } @else {
    <p>
      No data found
    </p>
  }
</div>

<div align='center'>
  <button-app-root [routerLink]="['/']" title="Back"></button-app-root>
</div>

<router-outlet />
